"px.windy_cluster" = { row = "F2", column = 2 }
"px.super_gravedigger" = { row = "F2", column = 3 }
"px.thumper_nade" = { row = "F2", column = 4 }
"px.electric_grenade" = { row = "F2", column = 5 }
"px.real_shotgun" = { row = "F3", column = 1 }
