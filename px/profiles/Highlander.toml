# Project X's Highlander (Highlander 0rang3 1.1): every PX weapon where PX's
# layout puts it, dealt by the Highlander rules. Each PX weapon's pool is its
# own suggestion (px/mod.toml); WA's Flame Thrower and Mine Strike stand in
# for PX's.
description = "Project X's Highlander: each worm is dealt one weapon from each of three pools, may use each once a turn, and takes everything a worm it kills carried."
features = ["hl.rules"]

[weapons]
"px.double_bazooka" = { row = "F1", column = 1 }
"px.igniter" = { row = "F1", column = 2 }
