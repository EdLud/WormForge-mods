[weapon_options."hl.rules"."stock.mine_strike"]
pool = "offensive"
cavern = false

[weapon_options."hl.rules"."stock.flame_thrower"]
pool = "second"

# PX's GiveWeapons: the Hot Air Balloons refilled to 3 and the Wind Changer
# to 1 each turn; each team gets one Weapon Crate a round.
[weapon_settings."px.hot_air_balloon"]
ammo = 3
each_turn = { amount = 3, mode = "replace" }

[weapon_settings."px.wind_changer"]
ammo = 1
each_turn = { amount = 1, mode = "replace" }

[weapon_settings."px.weapon_crate"]
ammo = 1
