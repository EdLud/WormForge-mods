# Project X's weapons, ported to WormForge, as a component bundle: each
# weapon is a component any profile can place (the loader's Manage Weapon
# Panel lists them), credited to its Project X authors. A weapon goes on any panel place.
#
# Highlander's rules are the hl.rules add-on (scheme/). Each PX weapon
# suggests its PX pool for them; a profile may set any weapon's. The profiles
# in profiles/ are copied into WormForge/Profiles when the loader installs
# this bundle. Where PX
# uses WA's own weapon unchanged (Teleport, Fast Walk, Crate Spy, Crate
# Shower, Flame Thrower) they place the stock one.
#
# Development tests and their match setup live outside this pack, in tests/px/.
id = "px.ports"
name = "Project X ports"
version = "0.20.63"
author = "Project X authors"
api_version = 4
format_version = 2
# Kill the King was its own pack until 0.17.0: installing this one retires it.
replaces = ["example.kill_the_king"]
dependencies = ["wf.sdk"]

