# Project X's weapons, ported to WormForge, as a component bundle: each
# weapon is a component any profile can place (the loader's Weapons tab lists
# them), credited to its Project X authors. A weapon goes on any panel place.
#
# Highlander's rules are the hl.rules add-on (scheme/). Each PX weapon
# suggests its PX pool for them; a profile may set any weapon's. The profiles
# in profiles/ (Highlander, and the same weapons without the rules) are
# copied into Mods/Profiles when the loader installs this bundle. Where PX
# uses WA's own weapon unchanged (Teleport, Fast Walk, Crate Spy, Crate
# Shower, Flame Thrower) they place the stock one.
#
# rules.lua is the Highlander pack in one piece, as the Lua tests load it.
id = "px.ports"
name = "Project X ports"
version = "0.10.0"
author = "Project X authors"
api_version = 2
format_version = 2
# Still calls worm:set_state while its weapons move to the engine's handoff
# verbs (worm-handoff plan); remove once none does.
debug_worm_state = true

[[components]]
id = "hl.rules"
type = "feature"
name = "Highlander rules"
description = "Project X's Highlander: each worm is dealt one weapon from each of three pools, may use each once a turn, and takes everything a worm it kills carried. Each placed weapon's pool is one of its settings."
entry = "components/highlander.lua"
before_weapons = true

[[components.weapon_options]]
key = "pool"
type = "choice"
choices = ["offensive", "second", "movement", "not dealt"]
default = "not dealt"
label = "Highlander pool"
description = "Each worm is dealt one weapon from each pool."

[[components.weapon_options]]
key = "cavern"
type = "bool"
default = true
label = "Dealt on cavern maps"
description = "Off for weapons that come from the sky."

