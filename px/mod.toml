# Project X's weapons, ported to WormForge, as a component bundle: each
# weapon is a component any scheme can place (the loader's Weapons tab lists
# them), credited to its Project X authors. A weapon goes on any panel place.
#
# Highlander is one PX scheme over them: hl.highlander places them all and
# deals them with Project X's rules (scheme/); hl.weapons_only places them
# without the rules. Where PX uses WA's own weapon unchanged (Teleport, Fast
# Walk, Crate Spy, Crate Shower, Flame Thrower) the preset places the stock
# one.
#
# rules.lua is the Highlander pack in one piece, as the Lua tests load it.
id = "px.weapons"
name = "Project X weapons"
version = "0.10.0"
author = "Project X authors"
api_version = 2
format_version = 2
# Still calls worm:set_state while its weapons move to the engine's handoff
# verbs (worm-handoff plan); remove once none does.
debug_worm_state = true

[[components]]
id = "hl.highlander"
type = "scheme"
name = "Highlander"
description = "Project X's Highlander: each worm is dealt one weapon from each of three pools, may use each once a turn, and takes everything a worm it kills carried."
entry = "components/highlander.lua"
preset = "highlander"
changes_rules = true
tags = ["highlander"]

[[components]]
id = "hl.weapons_only"
type = "scheme"
name = "Highlander weapons (no rules)"
description = "Every Highlander weapon where PX's layout puts it, without Highlander's rules: no dealing, no one shot each per turn. The ammo is the WA lobby scheme's."
entry = "components/weapons_only.lua"
preset = "highlander"

