[[components]]
id = "hl.rules"
type = "feature"
name = "Highlander rules"
credits = "from Highlander 0rang3 1.1"
description = "Each worm is dealt one weapon from each of three pools, may use each once a turn, and takes what a worm it kills carried."
entry = "components/highlander.lua"
before_weapons = true

[[components.weapon_options]]
key = "pool"
type = "choice"
choices = ["offensive", "second", "movement", "not dealt"]
default = "not dealt"
label = "Highlander pool"
description = "Each worm is dealt one weapon from each pool."

[[components.weapon_options]]
key = "cavern"
type = "bool"
default = true
label = "Dealt on cavern maps"
description = "Off for weapons that come from the sky."

[sprites."sprites/specialists/glow.png"]
frames = 1

[[components]]
id = "specialists.rules"
type = "feature"
name = "Specialists rules"
description = "Five worm classes with their own weapons and cooldowns, the Medic aura and the Soldier who returns once as a zombie. Use five worms per team and 100 HP."
entry = "components/specialists.lua"

[[components]]
id = "ktk.control"
type = "feature"
name = "Kill the King"
authors = ["Danylo"]
credits = "improved by 0rang3, ported by reddaz"
description = "The attackers must destroy the defenders' king before the timer runs out."
entry = "components/kill_the_king.lua"

[[components.options]]
key = "kings"
type = "choice"
choices = ["one", "two"]
default = "one"
label = "Number of kings"
description = "One or two kings; with two, either king falling wins for the attackers."

[[components.options]]
key = "attack_time_seconds"
type = "int"
min = 10
max = 3600
default = 300
label = "Attack time (seconds)"
description = "Timer for the attackers. 300 = 5:00."

[[components.options]]
key = "timer_mode"
type = "choice"
choices = ["attack_only", "defend_and_compensate"]
default = "attack_only"
label = "Timer mode"
description = "Attack only: the timer drains on attacker turns. Defend and compensate also adds time back on defender turns."

[[components.options]]
key = "defender_gain_ms"
type = "int"
min = 0
max = 100
default = 5
label = "Defender time gain (ms/frame)"
description = "Time the defenders get back per frame of their turns (Defend and compensate only)."

[[components.options]]
key = "attackers_team"
type = "choice"
choices = ["red", "blue", "green", "yellow", "purple", "cyan"]
default = "red"
label = "Attackers' team"
description = "WA team colour that attacks."

[[components.options]]
key = "defenders_team"
type = "choice"
choices = ["red", "blue", "green", "yellow", "purple", "cyan"]
default = "blue"
label = "Defenders' team"
description = "WA team colour that owns both kings."

[[components.options]]
key = "king1_x"
type = "int"
min = 0
max = 10000
default = 106
label = "King 1 X (top-left)"
description = "Map pixel coordinate of King 1's top-left corner."

[[components.options]]
key = "king1_y"
type = "int"
min = 0
max = 10000
default = 829
label = "King 1 Y (top-left)"
description = "Map pixel coordinate of King 1's top-left corner."

[[components.options]]
key = "king1_destroy_percent"
type = "int"
min = 1
max = 100
default = 70
label = "King 1 destruction threshold (%)"
description = "Solid terrain that must be destroyed. 70 leaves 30% HP; 100 needs full destruction."

[[components.options]]
key = "king2_x"
type = "int"
min = 0
max = 10000
default = 1420
label = "King 2 X (top-left)"
