[[components]]
id = "hl.rules"
type = "feature"
name = "Highlander rules"
credits = "from Highlander 0rang3 1.1"
description = "Each worm is dealt one weapon from each of three pools, may use each once a turn, and takes what a worm it kills carried."
entry = "components/highlander.lua"
before_weapons = true

[[components.weapon_options]]
key = "pool"
type = "choice"
choices = ["offensive", "second", "movement", "not dealt"]
default = "not dealt"
label = "Highlander pool"
description = "Each worm is dealt one weapon from each pool."

[[components.weapon_options]]
key = "cavern"
type = "bool"
default = true
label = "Dealt on cavern maps"
description = "Off for weapons that come from the sky."

[sprites."sprites/specialists/glow.png"]
frames = 1

[[components]]
id = "specialists.rules"
type = "feature"
name = "Specialists rules"
description = "Five worm classes with their own weapons and cooldowns, the Medic aura and the Soldier who returns once as a zombie, for five worms per team and 100 HP."
entry = "components/specialists.lua"

[sprites."sprites/random_race/rope_race.png"]
frames = 1

[sprites."sprites/random_race/park_race.png"]
frames = 1

[sprites."sprites/random_race/wing_race.png"]
frames = 1

[sprites."sprites/random_race/port_race.png"]
frames = 1

[sprites."sprites/random_race/heli_race.png"]
frames = 1

[[components]]
id = "random_race.rules"
type = "feature"
name = "Random Race"
authors = ["0rang3"]
description = "Each time the first team's turn comes round, a race is chosen at random and every team gets only its weapons: Parkour with Jump and Low Gravity, or Portal Gun, both with Anti Fall Damage; Wings; Helicopter; or Ninja Rope with Parachute."
entry = "components/random_race.lua"

[[components]]
id = "mad_heli_race.rules"
type = "feature"
name = "Mad Heli Race rules"
description = "Shows Mad Heli Race's rules at the first turn, and again on Shift + T."
entry = "components/mad_heli_race.lua"

[[components]]
id = "team17.rules"
type = "feature"
name = "Team17 rules"
authors = ["0rang3"]
credits = "crate scripts by Ted feat. Buxnaman, edited by m4d-c4t"
description = "A kill gives the turn's worm 30 HP and drops a weapon and a utility crate; a health crate drops every 6 to 8 minutes of turns. Firing the Fire Punch, Dragon Ball or Prod locks those and the Super Tele for the rest of the turn, as do the BlowTorch, Pneumatic Drill and Girder."
entry = "components/team17.lua"

[[components]]
id = "ktk.control"
type = "feature"
name = "Kill the King"
authors = ["Danylo"]
credits = "improved by 0rang3, ported by reddaz"
description = "The attackers must destroy the defenders' king before the timer runs out."
entry = "components/kill_the_king.lua"

[[components.options]]
key = "kings"
type = "choice"
choices = ["one", "two"]
default = "one"
label = "Number of kings"
description = "One or two kings; with two, either king falling wins for the attackers."

[[components.options]]
key = "attack_time_seconds"
type = "int"
min = 10
max = 3600
default = 300
label = "Attack time (seconds)"
description = "Timer for the attackers. 300 = 5:00."

[[components.options]]
key = "timer_mode"
type = "choice"
