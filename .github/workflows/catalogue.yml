name: Catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install Lua for PX tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Test Lua runtime code
        run: |
          for test in tests/*/test_*.lua; do lua5.4 "$test"; done
      - run: python tools/test_catalogue.py
      - run: python tools/publish-packs.py --check
