# Test profile: every class weapon, one class per F-row. Use five worms per team.
# The full game is the "Specialists 2.3" profile; the Soldier zombie isn't ported.
description = "Specialists class test: five worms per team, each class's weapons on its own F-row. Tests class switching, cooldowns and Medic healing. Crate Shower is supplied for pickup tests. The Soldier zombie is not ported yet."
features = ["core.utilities", "specialists.rules"]

[options."core.utilities"]
live_hp = true
ex_turn_side = true

[scheme]
worm_energy = 100
turn_time = 35
worm_select = "on"
worm_selection_is_never_cancelled = true
sudden_death_disables_worm_select = false
retreat_time = 0
gravity = 0.239990234375
hazards = 69
no_crate_probability = 255
weapon_use_doesn_t_end_turn = false
loss_of_control_doesn_t_end_turn = false

