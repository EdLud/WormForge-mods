# First phase-4 weapon batch. Use alongside the class profile for cooldown checks.
description = "Specialists weapons: Gatling Gun, Thrown Dynamite and Tele Arrow. Unlimited ammo and time for firing, animation and collision tests."
features = ["core.utilities"]

[options."core.utilities"]
live_hp = true

[scheme]
worm_energy = 255
turn_time = "unlimited"
weapon_use_doesn_t_end_turn = true
loss_of_control_doesn_t_end_turn = true
hazards = 0

[weapon_settings."px.gatling_gun"]
ammo = -1
after_use = "continue"
delay = 0
crate_pct = 0

[weapons."px.gatling_gun"]
row = "F1"
column = 1

