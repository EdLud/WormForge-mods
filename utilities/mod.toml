# Core utilities: a collection of features that could fit a diverse set of schemes
id = "core.utilities"
name = "Core utilities"
version = "0.17.0"
author = "WormForge"
api_version = 4
format_version = 2
dependencies = ["wf.sdk"]

# Installing this mod retires the older Fog of war and Cursor Suite mods.
replaces = ["core.fog", "example.cursor_suite"]

# This add-on turns on the fog of war
[fog]
enable = true
[[components]]

id = "core.utilities"
type = "feature"
name = "Utilities"
description = "A collection of features that could fit a diverse set of schemes"
entry = "features/utilities.lua"
credits = "ExTurnSide and Live HP by reddaz, Agility by Zed and 0rang3 (port by reddaz)"

[[components.options]]
key = "heal_per_turn"
type = "int"
default = 0
min = 0
max = 50
label = "Heal at turn start (HP)"
description = "Heals the worm by the set amount at the start of its turn."

[[components.options]]
key = "ex_turn_side"
type = "bool"
default = false
label = "ExTurnSide"
description = "Left and right turn the worm during jumps, flights and other actions."

[[components.options]]
key = "agility"
type = "bool"
default = false
label = "Agility"
description = "The arrow keys steer the worm a little in the air. By Zed and 0rang3, port by reddaz."

[[components.options]]
key = "parkour"
type = "bool"
default = false
label = "Parkour"
description = "In the air, Enter kicks the worm off a wall within 20 pixels and Backspace bunny-hops it off the land below."

[[components.options]]
key = "fast_aim"
type = "bool"
default = false
label = "Fast aim"
description = "Holding Shift while aiming makes the aim faster"

[[components.options]]
key = "fast_aim_speed"
type = "int"
default = 200
min = 1
max = 400
label = "Fast aim speed (%)"
description = "Aim speed with Shift held, as percentage."

[[components.options]]
key = "live_hp"
type = "bool"
default = false
label = "Live HP"
description = "Subtract health from damaged worms immediately"

[[components.options]]
key = "instant_death"
type = "choice"
choices = ["off", "settled", "in_flight"]
# Until 0.8.0 a switch: profiles saved with true die when settled.
from_bool = ["off", "settled"]
default = "off"
label = "Instant Death"
description = "off: normal behaviour, settled: once the worm is still it immediately triggers its death animation, in_flight: immediately dies when reaching 0"

[[components.options]]
key = "collect_viewer"
type = "bool"
default = false
label = "Collect viewer"
description = "Pop-up icon on collecting a crate"

[[components.options]]
key = "kill_counter"
type = "bool"
default = false
label = "Kill counter"
description = "Shows the number of kills an individual worm has acquired. Useful for Highlander"

[[components.options]]
key = "damage_numbers"
type = "bool"
default = false
label = "Damage numbers"
description = "Damage and healing float over the worm, Worms Reloaded style. By red"

[[components.options]]
key = "damage_numbers_side"
type = "choice"
choices = ["alternate", "facing", "random"]
default = "alternate"
label = "Damage number side"
description = "Where the damage numbers are spawned."

[[components.options]]
key = "fps_counter"
type = "bool"
default = false
label = "FPS counter"
description = "Enables an FPS counter"

# +N Seconds: extra turn time from utility crates.
# instant utilities.
[[components]]

id = "utilities.plus_ten"
type = "weapon"
name = "+N Seconds"
description = "Adds N seconds to the turn of the collecting / activating player"
entry = "weapons/plus_n.lua"
icon = "sprites/plus_n.png"
default_position = { row = "utility", column = 6 }

[[components.options]]
key = "seconds"
type = "int"
default = 10
min = 1
max = 500
label = "Seconds added"
description = "Time added by each activated unit."

# Bullet Time: the world in slow motion while the worm keeps its speed, fired
# like +N Seconds.
[[components]]
id = "utilities.bullet_time"
type = "weapon"
name = "Bullet Time"
description = "Slows down everything except the active worm (including the turn timer)"
entry = "weapons/bullet_time.lua"
icon = "sprites/bullet_time.png"
default_position = { row = "utility", column = 7 }

[[components.options]]
key = "world_speed"
type = "int"
default = 40
min = 10
max = 90
label = "World speed (%)"
description = "How fast the world is during Bullet Time"

[[components.options]]
key = "worm_speed"
type = "int"
default = 100
min = 10
max = 400
label = "Worm speed (%)"
description = "How fast the worm moves during Bullet Time, in percent"

[[components.options]]
key = "seconds"
type = "int"
default = 20
min = 1
max = 60
label = "Duration (s)"
description = "How long Bullet Time lasts, in real seconds."

[[components.options]]
key = "music"
type = "bool"
default = true
label = "Music slows too"
description = ""

[[components.options]]
key = "tab"
type = "bool"
default = true
label = "Activate with Tab"
description = "Enables the tab key to launch bullet time if worm select isn't active"

[[components]]
id = "core.fog"
type = "feature"
name = "Fog of war"
description = "Select this add-on in a profile to play with fog."
entry = "features/fog.lua"
credits = "wkFOW"

[[components.options]]
key = "circle_radius"
type = "int"
default = 250
min = 0
max = 700
label = "Circle radius"
description = "Awareness circle around worms, in pixels, independent of aim."

[[components.options]]
key = "cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Cone width"
description = "Width of the aim-directed view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Cone length"
description = "Reach of the aim-directed view cone, in pixels. 0 means no cone."

[[components.options]]
key = "shadow_cast"
type = "bool"
default = true
label = "Shadow casting"
description = "Shadow casting: terrain blocks worms' and animals' vision. Off lights the full circle, whatever the terrain."

[[components.options]]
key = "discover"
type = "choice"
choices = ["off", "texture", "live", "premapped"]
default = "texture"
label = "Terrain memory"
description = "Terrain memory: 0 off, 1 stale terrain, 2 live terrain, 3 premapped."

[[components.options]]
key = "view_ownership"
type = "choice"
choices = ["alliance", "active", "everyone"]
default = "alliance"
label = "Vision ownership"
description = "Whose vision players see: 1 their alliance, 2 the active worm only, 3 everyone."

[[components.options]]
key = "animal_circle_radius"
type = "int"
default = 150
min = 0
max = 700
label = "Animal circle radius"
description = "Awareness circle around every animal, in pixels. 0 means animals see nothing."

[[components.options]]
key = "animal_cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Animal cone length"
description = "Reach of an animal's view cone, in pixels. 0 means no cone."

[[components.options]]
key = "animal_cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Animal cone width"
description = "Width of an animal's view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "proj_circle"
type = "int"
default = 5
min = 0
max = 700
label = "Projectile circle"
description = "Extra pixels of awareness outside each projectile's live sprite bounds."

[[components.options]]
key = "proj_cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Projectile cone length"
description = "Reach of a projectile's view cone, in pixels. 0 means no cone."

[[components.options]]
key = "proj_cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Projectile cone width"
description = "Width of a projectile's view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "proj_shadow_cast"
type = "bool"
default = false
label = "Projectile shadow casting"
description = "Shadow casting for projectiles' light: terrain blocks it."

[[components.options]]
key = "proj_ownership"
type = "choice"
choices = ["everyone", "active"]
default = "everyone"
label = "Projectile vision"
description = "Projectile light ownership: everyone, or only the alliance that fired it."

[[components.options]]
key = "explosion_circle"
type = "int"
default = 40
min = 0
max = 700
label = "Explosion circle"
description = "Temporary light radius after explosions."

[[components.options]]
key = "explosion_ownership"
type = "choice"
choices = ["everyone", "active"]
default = "everyone"
label = "Explosion vision"
description = "Explosion vision ownership: everyone, active"

[[components.options]]
key = "crate_circle"
type = "int"
default = 20
min = 0
max = 700
label = "Crate circle"
description = "Light around every crate, in pixels, seen by everyone."

[[components.options]]
key = "crate_shadow_cast"
type = "bool"
default = true
label = "Crate shadow casting"
description = "Shadow casting for crates' light: terrain blocks it. Off lights the full circle."

[[components.options]]
key = "spectator_mode"
type = "bool"
default = true
label = "Reveal map for spectators"
description = "Reveal the whole map to spectators and alliances with no surviving worms."

[[components.options]]
key = "camera_follow"
type = "choice"
choices = ["everything", "all but enemies", "only my side"]
default = "all but enemies"
label = "Camera follows"
description = "everything: normal camera. all but enemies: never the enemies' worms, cursor or shots, so the camera can't give them away; crates, barrels, fire and explosions still pull it. only my side: not those either, only own side's worms, cursor and shots."

[[components.options]]
key = "hide_enemy_hud"
type = "bool"
default = true
label = "Hide enemy labels and arrows"
description = "Hide enemy labels and arrows."

[[components.options]]
key = "placement_vision"
type = "bool"
default = false
label = "Reveal map during placement"
description = "Map visible during manual worm placement. Useful for races."

[[components.options]]
key = "fog_floor"
type = "int"
default = 0
min = 0
max = 100
label = "Minimum brightness (%)"
description = "Fog brightness floor, percent. 0 is full darkness; higher values lift the whole map toward visibility."

# Worm glow: every worm lit from within, the fog's look of worms as lights.
[[components]]
id = "core.worm_glow"
type = "feature"
name = "Worm glow"
description = "A soft glow round every worm."
entry = "features/worm_glow.lua"

[[components.options]]
key = "strength"
type = "int"
default = 50
min = 1
max = 100
label = "Strength (%)"
description = "How strongly a worm glows, 1 to 100."

[[components.options]]
key = "radius"
type = "int"
default = 3
min = 1
max = 16
label = "Blur radius"
description = "How far the glow spreads past the worm, in pixels."

[[components.options]]
key = "pad"
type = "int"
default = 0
min = 0
max = 40
label = "Padding"
description = "Room round each pose for the glow, in pixels. 0 grows it with the blur radius (twice the radius and one). Less than that cuts the glow off at a box round the worm."

[[components.options]]
key = "gain"
type = "int"
default = 160
min = 10
max = 800
label = "Gain (%)"
description = "How solid the glow is near the worm before it fades."

[[components.options]]
key = "red"
type = "int"
default = 255
min = 0
max = 255
label = "Red"
description = "The glow's colour, red part: 0 to 255."

[[components.options]]
key = "green"
type = "int"
default = 255
min = 0
max = 255
label = "Green"
description = "The glow's colour, green part: 0 to 255."

[[components.options]]
key = "blue"
type = "int"
default = 255
min = 0
max = 255
label = "Blue"
description = "The glow's colour, blue part: 0 to 255."

# The Cursor: one weapon with seven modes.
[[components]]
id = "cursors.cursor"
type = "weapon"
name = "Cursor"
description = "Press + to cycle through Light, Magnet attract, Magnet repel, Revive, Freeze, Fire and Hurt. Click to revive, freeze or deal 10 HP damage; hold the left mouse button for rainbow fire."
entry = "weapons/cursor.lua"
icon = "sprites/cursor.png"
default_position = { row = "F8", column = 1 }
