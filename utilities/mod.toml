# Core utilities (format_version 2): one feature with the match settings the
# lobby scheme doesn't have and some players' favourite packs as switches,
# fog of war, utilities of our own (+N Seconds, Bullet Time) and the Cursor.
# Nothing runs until a profile selects it (its card in the mod loader).
# See README.md.
id = "core.utilities"
name = "Core utilities"
version = "0.15.0"
author = "WormForge"
api_version = 4
format_version = 2
dependencies = ["wf.sdk"]

# Fog of war and the Cursor Suite were their own packs until 0.5.0:
# installing this one retires them.
replaces = ["core.fog", "example.cursor_suite"]

# The fog of war add-on (core.fog) drives the fog renderer.
[fog]
enable = true
[[components]]

id = "core.utilities"
type = "feature"
name = "Utilities"
description = "Match settings the lobby scheme doesn't have, and some players' favourite packs as switches."
entry = "features/utilities.lua"
credits = "ExTurnSide and Live HP by reddaz, Agility by Zed and 0rang3 (port by reddaz)"

[[components.options]]
key = "heal_per_turn"
type = "int"
default = 0
min = 0
max = 50
label = "Heal at turn start (HP)"
description = "Health the turn's first worm gets; switching worms (Tab, Select Worm) doesn't heal again."

[[components.options]]
key = "ex_turn_side"
type = "bool"
default = false
label = "ExTurnSide"
description = "Left and right turn the worm during jumps, flights and other actions; not on the rope, in a Kamikaze or while Shift is held. By red."

[[components.options]]
key = "agility"
type = "bool"
default = false
label = "Agility"
description = "The arrow keys steer the worm a little in the air. By Zed and 0rang3, port by reddaz."

[[components.options]]
key = "parkour"
type = "bool"
default = false
label = "Parkour"
description = "In the air, Enter kicks the worm off a wall within 20 pixels and Backspace bunny-hops it off the land below. From Project X."

[[components.options]]
key = "fast_aim"
type = "bool"
default = false
label = "Fast aim"
description = "Holding Shift changes how fast the up and down keys aim, at the speed below. Weapons that aim in coarse steps, like the Blow Torch, keep WA's own aim. From Project X. Needs a WormForge newer than 0.9.8."

[[components.options]]
key = "fast_aim_speed"
type = "int"
default = 200
min = 1
max = 400
label = "Fast aim speed (%)"
description = "The aim's speed with Shift held, as a percentage of WA's own: 200 is twice as fast, 50 half as fast, for finer aim."

[[components.options]]
key = "live_hp"
type = "bool"
default = false
label = "Live HP"
description = "Non-active worms' health bars follow damage immediately, down to zero, preserving frozen state and momentum. Death timing stays with WA. Originally by reddaz."

[[components.options]]
key = "instant_death"
type = "choice"
choices = ["off", "settled", "in_flight"]
# Until 0.8.0 a switch: profiles saved with true die when settled.
from_bool = ["off", "settled"]
default = "off"
label = "Instant Death"
description = "Zero-HP non-active worms die without waiting for other objects. settled: WA's own death once the worm's own motion stops. in_flight: at once, wherever it is, and it flies on while it dies, as in Project X. Works independently of Live HP."

[[components.options]]
key = "collect_viewer"
type = "bool"
default = false
label = "Collect viewer"
description = "What a crate gave pops up over it, for the team that took it."

[[components.options]]
key = "kill_counter"
type = "bool"
default = false
label = "Kill counter"
description = "A badge behind each worm counts its kills, 1 to 9, then infinity. The worm whose turn it is gets the kill and the victim's own count with it. From Project X."

[[components.options]]
key = "damage_numbers"
type = "bool"
default = false
label = "Damage numbers"
description = "Damage and healing float over the worm, Worms Reloaded style. Uses Live HP's frame snapshot."

[[components.options]]
key = "damage_numbers_side"
type = "choice"
choices = ["alternate", "facing", "random"]
default = "alternate"
label = "Damage number side"
description = "alternate starts on the worm's facing side, then flips left/right per worm so hits stay readable; facing always follows the worm; random is a local coin."

[[components.options]]
key = "fps_counter"
type = "bool"
default = false
label = "FPS counter"
description = "Each player's own frame rate at the top right of their screen. Shows only; it changes nothing in the match. Needs a WormForge newer than 0.9.7."

# An instant utility of our own: configurable extra time, in utility crates.
# Auto-Use, uses per turn, extra pickups and retreat pickups are its weapon
# settings (auto_use, uses_per_turn, extra_pickups, retreat_collect), as for
# WA's instant utilities; profiles' older bonus_mode and retreat_collect
# options are read into them.
[[components]]

id = "utilities.plus_ten"
type = "weapon"
name = "+N Seconds"
description = "Adds configurable turn time. Its weapon settings choose how many bonuses a turn gets and what extra and retreat pickups do. Manual use does not end the turn."
entry = "weapons/plus_n.lua"
icon = "sprites/plus_n.png"
default_position = { row = "utility", column = 6 }

[[components.options]]
key = "seconds"
type = "int"
default = 10
min = 1
max = 500
label = "Seconds added"
description = "Time added by each activated unit."

# Bullet Time: the world in slow motion and the worm on its own time for a
# set time, fired like +N Seconds.
[[components]]
id = "utilities.bullet_time"
type = "weapon"
name = "Bullet Time"
description = "Fire it and the world eases into slow motion, tinted blue, while your worm keeps its speed, for a set time. It can't be paused, and ends with the turn."
entry = "weapons/bullet_time.lua"
icon = "sprites/bullet_time.png"
default_position = { row = "utility", column = 7 }

[[components.options]]
key = "world_speed"
type = "int"
default = 40
min = 10
max = 90
label = "World speed (%)"
description = "How fast the world runs during Bullet Time, as a percentage of the scheme's engine speed."

[[components.options]]
key = "worm_speed"
type = "int"
default = 100
min = 10
max = 400
label = "Worm speed (%)"
description = "How fast your worm runs meanwhile, in real time: 100 keeps its normal speed while the world crawls. At most 8 times the world's."

[[components.options]]
key = "seconds"
type = "int"
default = 6
min = 1
max = 60
label = "Duration (s)"
description = "How long Bullet Time lasts, in real seconds, easing in and out (2 s each) included."

# Fog of war (wkFOW's renderer): until 0.5.0 its own bundle, core.fog.
[[components]]
id = "core.fog"
type = "feature"
name = "Fog of war"
description = "Vision, terrain memory and lighting. Select this add-on in a profile to enable fog."
entry = "features/fog.lua"
credits = "wkFOW"

[[components.options]]
key = "circle_radius"
type = "int"
default = 250
min = 0
max = 700
label = "Circle radius"
description = "Awareness circle around worms, in pixels, independent of aim."

[[components.options]]
key = "cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Cone width"
description = "Width of the aim-directed view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Cone length"
description = "Reach of the aim-directed view cone, in pixels. 0 means no cone."

[[components.options]]
key = "shadow_cast"
type = "bool"
default = true
label = "Shadow casting"
description = "Shadow casting: terrain blocks worms' and animals' vision. Off lights the full circle, whatever the terrain."

[[components.options]]
key = "discover"
type = "choice"
choices = ["off", "texture", "live", "premapped"]
default = "texture"
label = "Terrain memory"
description = "Terrain memory: 0 off, 1 stale terrain, 2 live terrain, 3 premapped."

[[components.options]]
key = "view_ownership"
type = "choice"
choices = ["alliance", "active", "everyone"]
default = "alliance"
label = "Vision ownership"
description = "Whose vision lights the map: 1 my alliance, 2 the active worm only, 3 everyone."

[[components.options]]
key = "animal_circle_radius"
type = "int"
default = 150
min = 0
max = 700
label = "Animal circle radius"
description = "Awareness circle around every animal, in pixels. 0 means animals see nothing."

[[components.options]]
key = "animal_cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Animal cone length"
description = "Reach of an animal's view cone, in pixels. 0 means no cone."

[[components.options]]
key = "animal_cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Animal cone width"
description = "Width of an animal's view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "proj_circle"
type = "int"
default = 5
min = 0
max = 700
label = "Proj circle"
description = "Extra pixels of awareness outside each projectile's live sprite bounds."

[[components.options]]
key = "proj_cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Proj cone length"
description = "Reach of a projectile's view cone, in pixels. 0 means no cone."

[[components.options]]
key = "proj_cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Proj cone width"
description = "Width of a projectile's view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "proj_shadow_cast"
type = "bool"
default = false
label = "Projectile shadow casting"
description = "Shadow casting for projectiles' light: terrain blocks it."

[[components.options]]
key = "proj_ownership"
type = "choice"
choices = ["everyone", "active"]
default = "everyone"
label = "Projectile vision"
description = "Who sees a projectile's light: everyone, or only the alliance that fired it (for a projectile without a team, the alliance whose turn it is, its retreat included)."

[[components.options]]
key = "explosion_circle"
type = "int"
default = 40
min = 0
max = 700
label = "Explosion circle"
description = "Temporary light radius past a crater's rim after explosions."

[[components.options]]
key = "explosion_ownership"
type = "choice"
choices = ["everyone", "active"]
default = "everyone"
label = "Explosion vision"
description = "Who sees an explosion's light and its crater, and the glow of fire: everyone, or only the alliance whose turn made it, its retreat included."

[[components.options]]
key = "crate_circle"
type = "int"
default = 20
min = 0
max = 700
label = "Crate circle"
description = "Light around every supply crate, in pixels, seen by everyone. 0 means crates give no light."

[[components.options]]
key = "crate_shadow_cast"
type = "bool"
default = true
label = "Crate shadow casting"
description = "Shadow casting for crates' light: terrain blocks it. Off lights the full circle."

[[components.options]]
key = "spectator_mode"
type = "bool"
default = true
label = "Reveal map for spectators"
description = "Reveal the whole map to spectators and alliances with no surviving worms. Living allies keep their shared vision."

[[components.options]]
key = "camera_follow"
type = "choice"
choices = ["everything", "all but enemies", "only my side"]
default = "all but enemies"
label = "Camera follows"
description = "everything: WA's normal camera. all but enemies: never the enemies' worms, cursor or shots, so the camera can't give them away; crates, barrels, fire and explosions still pull it. only my side: not those either, only your own side's worms, cursor and shots."

[[components.options]]
key = "hide_enemy_hud"
type = "bool"
default = true
label = "Hide enemy labels and arrows"
description = "Never show the other sides' worm names, team names and health, the arrow over the worm whose turn it is, the worm select arrows, their cursors, markers and crosshair, even where your light reaches them. One exception: an enemy's health shows while the light of your worm whose turn it is reaches its body. Off: they all show wherever the fog is lit."

[[components.options]]
key = "placement_vision"
type = "bool"
default = false
label = "Reveal map during placement"
description = "Map visible during manual worm placement."

[[components.options]]
key = "fog_floor"
type = "int"
default = 0
min = 0
max = 100
label = "Minimum brightness (%)"
description = "Fog brightness floor, percent. 0 is full darkness; higher values lift the whole map toward visibility."

# Worm glow: every worm lit from within, for the fog's look of worms as lights.
[[components]]
id = "core.worm_glow"
type = "feature"
name = "Worm glow"
description = "A soft glow round every worm, in every pose and with every weapon, as if the light the fog of war draws round a worm came from it. A worm a mod tints itself (the Specialists zombie) keeps its own. Needs the shader renderer."
entry = "features/worm_glow.lua"

[[components.options]]
key = "strength"
type = "int"
default = 50
min = 1
max = 100
label = "Strength (%)"
description = "How strongly the glow shows, 1 to 100."

[[components.options]]
key = "radius"
type = "int"
default = 3
min = 1
max = 16
label = "Blur radius"
description = "How far the glow spreads past the worm, in pixels: its silhouette blurred twice by this much. Larger is softer and wider."

[[components.options]]
key = "pad"
type = "int"
default = 0
min = 0
max = 40
label = "Padding"
description = "Room round each pose for the glow, in pixels. 0 grows it with the blur radius (twice the radius and one). Less than that cuts the glow off at a box round the worm."

[[components.options]]
key = "gain"
type = "int"
default = 160
min = 10
max = 800
label = "Gain (%)"
description = "How solid the glow is near the worm before it fades: the blur brightened by this much. Higher keeps it bright further out."

[[components.options]]
key = "red"
type = "int"
default = 255
min = 0
max = 255
label = "Red"
description = "The glow's colour, its red part: 0 to 255. White (255, 255, 255) by default; the worm itself keeps WA's colours."

[[components.options]]
key = "green"
type = "int"
default = 255
min = 0
max = 255
label = "Green"
description = "The glow's colour, its green part: 0 to 255. White (255, 255, 255) by default; the worm itself keeps WA's colours."

[[components.options]]
key = "blue"
type = "int"
default = 255
min = 0
max = 255
label = "Blue"
description = "The glow's colour, its blue part: 0 to 255. White (255, 255, 255) by default; the worm itself keeps WA's colours."

# One Cursor weapon with seven modes: until 0.5.0 the Cursor Suite bundle.
[[components]]
id = "cursors.cursor"
type = "weapon"
name = "Cursor"
description = "Press + to cycle Light, Magnet attract, Magnet repel, Revive, Freeze, Fire and Hurt. Click to revive/freeze or deal 10 HP damage; hold left mouse for rainbow fire."
entry = "weapons/cursor.lua"
icon = "sprites/cursor.png"
default_position = { row = "F8", column = 1 }
