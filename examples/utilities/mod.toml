# Core utilities (format_version 2): one feature with the match settings the
# lobby scheme doesn't have, and some players' favourite packs as switches.
# Nothing runs until a profile selects it (the mod loader's Profile tab).
# See README.md.
id = "core.utilities"
name = "Core utilities"
version = "0.2.0"
author = "WormForge"
api_version = 3
format_version = 2

[[components]]
id = "core.utilities"
type = "feature"
name = "Utilities"
description = "Match settings the lobby scheme doesn't have, and some players' favourite packs as switches."
entry = "features/utilities.lua"
credits = "ExTurnSide by red, Live HP by reddaz, Agility by Zed and 0rang3 (port by red)"

[[components.options]]
key = "gravity_pct"
type = "int"
default = 100
min = 25
max = 200
label = "Gravity %"
description = "The scheme's gravity, scaled. Low Gravity still halves it."

[[components.options]]
key = "wind"
type = "choice"
choices = ["scheme", "calm", "none"]
default = "scheme"
label = "Wind"
description = "calm halves each turn's wind; none stills it."

[[components.options]]
key = "heal_per_turn"
type = "int"
default = 0
min = 0
max = 50
label = "Heal at turn start (HP)"
description = "Health the worm whose turn starts gets."

[[components.options]]
key = "ex_turn_side"
type = "bool"
default = false
label = "ExTurnSide"
description = "Left and right turn the worm during rope swings and other actions. By red."

[[components.options]]
key = "agility"
type = "bool"
default = false
label = "Agility"
description = "The arrow keys steer the worm a little in the air. By Zed and 0rang3, port by red."

[[components.options]]
key = "live_hp"
type = "bool"
default = false
label = "Live HP"
description = "Health bars follow damage as it happens, not at the turn's end. By reddaz."

[[components.options]]
key = "collect_viewer"
type = "bool"
default = false
label = "Collect viewer"
description = "What a crate gave pops up over it, for the team that took it."
