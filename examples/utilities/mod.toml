# Core utilities (format_version 2): one feature with the match settings the
# lobby scheme doesn't have and some players' favourite packs as switches, and
# an instant utility of our own (+10 Seconds).
# Nothing runs until a profile selects it (the mod loader's Profile tab).
# See README.md.
id = "core.utilities"
name = "Core utilities"
version = "0.4.2"
author = "WormForge"
api_version = 4
format_version = 2
[[components]]

id = "core.utilities"
type = "feature"
name = "Utilities"
description = "Match settings the lobby scheme doesn't have, and some players' favourite packs as switches."
entry = "features/utilities.lua"
credits = "ExTurnSide by red, Live HP by reddaz, Agility by Zed and 0rang3 (port by red)"

[[components.options]]
key = "heal_per_turn"
type = "int"
default = 0
min = 0
max = 50
label = "Heal at turn start (HP)"
description = "Health the worm whose turn starts gets."

[[components.options]]
key = "ex_turn_side"
type = "bool"
default = false
label = "ExTurnSide"
description = "Left and right turn the worm during rope swings and other actions. By red."

[[components.options]]
key = "agility"
type = "bool"
default = false
label = "Agility"
description = "The arrow keys steer the worm a little in the air. By Zed and 0rang3, port by red."

[[components.options]]
key = "live_hp"
type = "bool"
default = false
label = "Live HP"
description = "Non-active worms' health bars follow damage immediately, down to zero, preserving frozen state and momentum. Death timing stays with WA. Originally by reddaz."

[[components.options]]
key = "instant_death"
type = "bool"
default = false
label = "Instant Death"
description = "Zero-HP non-active worms begin their normal death sequence once their own motion settles, without waiting for other objects. Works independently of Live HP."

[[components.options]]
key = "collect_viewer"
type = "bool"
default = false
label = "Collect viewer"
description = "What a crate gave pops up over it, for the team that took it."

[[components.options]]
key = "damage_numbers"
type = "bool"
default = false
label = "Damage numbers"
description = "Damage and healing float over the worm, Worms Reloaded style. Uses Live HP's frame snapshot."

[[components.options]]
key = "damage_numbers_side"
type = "choice"
choices = ["alternate", "facing", "random"]
default = "alternate"
label = "Damage number side"
description = "alternate starts on the worm's facing side, then flips left/right per worm so hits stay readable; facing always follows the worm; random is a local coin."

# An instant utility of our own: ten more seconds of turn, in utility crates.
# Auto-Use is configured by the profile's compatible on_collect use/keep choice.
[[components]]

id = "utilities.plus_ten"
type = "weapon"
name = "+10 Seconds"
description = "Adds ten seconds to the turn. Auto-Use spends one at turn start or on pickup if unused this turn, keeping extras. Manual use does not end the turn."
entry = "weapons/plus_ten.lua"
icon = "sprites/plus_ten.png"
default_position = { row = "utility", column = 6 }
