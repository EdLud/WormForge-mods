# Every weapon we have that fits: all 89 custom weapons (the Project X ports
# where the Highlander profile puts them, every example weapon) and 41 of WA's
# own, 130 in all: the whole panel, 13 rows of 10. With the Shuffled panel
# add-on. Ammo is infinite and there is no delay, set here: a weapon past
# slot 70 has no lobby ammo to fall back on.
description = "The whole panel: all 89 custom weapons and 41 of WA's own, 130 in all, infinite ammo. Each turn the weapons swap places at random (Shuffled panel)."
features = ["labs.shuffle_panel"]

