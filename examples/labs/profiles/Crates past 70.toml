# Crates past 70: what a crate can hold when the only weapons with a crate
# weight sit past WA's 70. Every stock weapon gets no crates; the three
# Record Lab weapons past 70 start with none and come in crates only, one
# of them in utility crates. Crate Shower (infinite) drops them.
