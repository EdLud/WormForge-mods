# Small weapons and an add-on that each show one part of the API. Nothing
# runs until a profile selects them; profiles/Labs.toml places them all.
id = "example.labs"
version = "0.2.0"
author = "wkLua"
api_version = 3
format_version = 2

[[components]]
id = "labs.cut_lab"
type = "weapon"
name = "Cut Lab"
description = "WA's Bazooka cuts a hole of the chosen shape where it lands: + cycles the shape, 1-9 and 0 set the size. A bench for wa.land.cut."
entry = "cut_lab/cut_lab.lua"
icon = "bazooka"
default_position = { row = "F1", column = 1 }

[[components]]
id = "labs.hurt_lab"
type = "weapon"
name = "Ten"
description = "Space takes 10 hp from every enemy worm: WA's own fire is eaten and worm:hurt does the rest."
entry = "hurt_lab.lua"
icon = "fire_punch"
default_position = { row = "F4", column = 1 }

[[components]]
id = "labs.echo_mine"
type = "weapon"
name = "Echo Mine"
description = "WA's mine, whose blast fans out a cluster: on_proximity and on_explode as data."
entry = "echo_mine.lua"
icon = "mine"
default_position = { row = "F5", column = 2 }

[[components]]
id = "labs.panel_icon"
type = "weapon"
name = "Hellish Hand Grenade (icon)"
description = "WA's Holy Hand Grenade with a pack PNG as its panel icon."
entry = "panel_icon/panel_icon.lua"
icon = "panel_icon/hhh_ico.png"
default_position = { row = "F9", column = 2 }

[[components]]
id = "labs.worm_toss"
type = "weapon"
name = "Worm Toss"
description = "Grab a worm with the land cursor and throw it: a cursor actor and a click eaten at its source."
entry = "worm_toss.lua"
icon = "battle_axe"
default_position = { row = "F2", column = 4 }

[[components]]
id = "labs.q_bazooka"
type = "feature"
name = "Q selects the Bazooka"
description = "Pressing Q selects WA's Bazooka, wherever the profile placed it."
entry = "q_bazooka.lua"

