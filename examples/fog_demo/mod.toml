id = "core.fog"
name = "Fog of war"
version = "0.2.0"
author = "WormForge"
api_version = 4
format_version = 2

[fog]
enable = true

[[components]]
id = "core.fog"
type = "feature"
name = "Fog of war"
description = "Vision, terrain memory and lighting. Select this add-on in a profile to enable fog."
entry = "init.lua"
credits = "wkFOW"

[[components.options]]
key = "circle_radius"
type = "int"
default = 250
min = 0
max = 700
label = "Circle radius"
description = "Awareness circle around worms, in pixels, independent of aim."

[[components.options]]
key = "cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Cone width"
description = "Width of the aim-directed view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Cone length"
description = "Reach of the aim-directed view cone, in pixels. 0 means no cone."

[[components.options]]
key = "shadow_cast"
type = "bool"
default = true
label = "Shadow casting"
description = "Shadow casting: terrain blocks worms' and animals' vision. Off lights the full circle, whatever the terrain."

[[components.options]]
key = "discover"
type = "choice"
choices = ["off", "texture", "live", "premapped"]
default = "texture"
label = "Terrain memory"
description = "Terrain memory: 0 off, 1 stale terrain, 2 live terrain, 3 premapped."

[[components.options]]
key = "view_ownership"
type = "choice"
choices = ["alliance", "active", "everyone"]
default = "alliance"
label = "Vision ownership"
description = "Whose vision lights the map: 1 my alliance, 2 the active worm only, 3 everyone."

[[components.options]]
key = "animal_circle_radius"
type = "int"
default = 150
min = 0
max = 700
label = "Animal circle radius"
description = "Awareness circle around every animal, in pixels. 0 means animals see nothing."

[[components.options]]
key = "animal_cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Animal cone length"
description = "Reach of an animal's view cone, in pixels. 0 means no cone."

[[components.options]]
key = "animal_cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Animal cone width"
description = "Width of an animal's view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "proj_circle"
type = "int"
default = 5
min = 0
max = 700
label = "Proj circle"
description = "Extra pixels of awareness outside each projectile's live sprite bounds."

[[components.options]]
key = "proj_cone_length"
type = "int"
default = 0
min = 0
max = 700
label = "Proj cone length"
description = "Reach of a projectile's view cone, in pixels. 0 means no cone."

[[components.options]]
key = "proj_cone_width"
type = "int"
default = 45
min = 45
max = 360
label = "Proj cone width"
description = "Width of a projectile's view cone, in degrees. 360 is a full circle."

[[components.options]]
key = "proj_shadow_cast"
type = "bool"
default = false
label = "Projectile shadow casting"
description = "Shadow casting for projectiles' light: terrain blocks it."

[[components.options]]
key = "explosion_circle"
type = "int"
default = 40
min = 0
max = 700
label = "Explosion circle"
description = "Temporary public light radius past a crater's rim after explosions."

[[components.options]]
key = "crate_circle"
type = "int"
default = 20
min = 0
max = 700
label = "Crate circle"
description = "Terrain-blocked awareness circle around supply crates."

[[components.options]]
key = "spectator_mode"
type = "bool"
default = true
label = "Reveal map for spectators"
description = "Reveal the whole map to spectators and alliances with no surviving worms. Living allies keep their shared vision."

[[components.options]]
key = "placement_vision"
type = "bool"
default = false
label = "Reveal map during placement"
description = "Map visible during manual worm placement."

[[components.options]]
key = "fog_floor"
type = "int"
default = 0
min = 0
max = 100
label = "Minimum brightness (%)"
description = "Fog brightness floor, percent. 0 is full darkness; higher values lift the whole map toward visibility."
