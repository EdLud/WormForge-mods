# Diagnostics, a stress test and the pass-over test, as add-ons. profiles/ holds two: the
# profiler and the state logger on their own, and the stress test with the Highlander weapons it
# fires (that one needs the px.ports bundle too).
id = "example.tools"
version = "0.6.0"
author = "wkLua"
api_version = 4
format_version = 2
debug_input = true

[[components]]
id = "tools.hello"
type = "feature"
name = "Hello"
description = "Logs the turn phases and every hurt, as the smallest add-on there is."
entry = "hello.lua"

[[components]]
id = "tools.pass_over"
type = "feature"
name = "Pass-over test"
description = "Tests worm.selectable and worm:input, as Specialists' zombies will use them: the chosen worms are renamed Passed over, WA's turns and Tab skip them, and they walk toward the worm whose turn it is."
entry = "pass_over.lua"

[[components.options]]
key = "worms"
type = "choice"
choices = ["first", "all"]
default = "first"
label = "Passed over"
description = "first: each team's first worm. all: every worm, so WA's own pick has to stand and turns go on as usual."

[[components.options]]
key = "walk"
type = "bool"
default = true
label = "Walk toward the turn's worm"
description = "While the turn clock runs, each passed-over worm walks toward the worm whose turn it is, any team's."

[[components]]
id = "tools.perf"
diagnostics = true
type = "feature"
name = "Profiler"
description = "WormForge's profiler (wkLua.log), on this machine. The FPS counter is Core utilities' FPS counter option."
entry = "perf.lua"

[[components.options]]
key = "spikes"
type = "bool"
default = false
label = "Name what spikes spent their time on"
description = "Each perf spike line in wkLua.log also names the Lua lines and the verbs (as [C] play) a slow Lua call spent its time on. Lua runs slower while it is on."

[[components.options]]
key = "packs"
type = "bool"
default = false
label = "Time each pack"
description = "The perf lua line in wkLua.log also gives each pack's hook handler time. Every hook call runs slower while it is on."

[[components.options]]
key = "natives"
type = "bool"
default = false
label = "Time each verb"
description = "The perf lua line in wkLua.log also gives the slowest verbs (as quad or all), every call of each summed, not only inside spikes. Lua runs slower while it is on."

[[components]]
id = "tools.worm_state_logger"
diagnostics = true
type = "feature"
name = "Worm state logger"
description = "One HUD line with the active worm's raw state, and every change logged: for naming WA's worm states."
entry = "worm_state_logger.lua"

[[components]]
id = "tools.equip_check"
diagnostics = true
type = "feature"
name = "worm:equip check"
description = "Offline, team 1's first four turns: equip refused mid-use, no shot while WA has weapons off, a free shot fired and one taken back unused. Results in wkLua.log and on the HUD."
entry = "equip_check.lua"

[[components]]
id = "tools.stress"
diagnostics = true
type = "feature"
name = "Stress test"
description = "Four batches of projectiles in the first turn, WA's and WormForge's, for performance and sync: record a replay and play it back."
entry = "stress/stress.lua"

[[components]]
id = "tools.audit"
diagnostics = true
type = "feature"
name = "Stock weapon slot audit"
description = "Offline scripted firing and diagnostic log; requires the generated Audit map and an Audit profile."
entry = "audit/audit.lua"

[[components.options]]
key = "copies"
type = "bool"
default = false
label = "Fire the copies past 70"
description = "Each case fires its plain copy (tools.copy_<name>) in place of WA's own; with the profile's custom_slots = \"past_70\" they sit past 70, so a difference from a home run is something WA ties to the slot id."

[[components.options]]
key = "scope"
type = "choice"
choices = ["all", "sheep", "followup", "utilities", "banana"]
default = "all"
label = "Audit cases"
description = "sheep checks sheep activations; followup checks Bungee, instant utilities and the final fresh-worm cases; utilities checks Jet Pack to Crate Shower; banana runs the Banana Bomb alone."

