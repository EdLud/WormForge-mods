# Highlander, on Project X's weapon layout, as a component bundle: each of
# its weapons is a component a scheme can place (the Profile tab lists them),
# and Highlander itself is the scheme hl.highlander, which places them all
# and deals them with Project X's rules (scheme/). A weapon goes on any
# panel place. Where PX uses WA's own weapon unchanged (Teleport, Fast Walk,
# Crate Spy, Crate Shower, Flame Thrower) the preset places the stock one.
#
# rules.lua is the same pack in one piece, as the Lua tests load it.
id = "example.highlander"
version = "0.10.0"
author = "wkLua"
api_version = 2
format_version = 2
# Still calls worm:set_state while its weapons move to the engine's handoff
# verbs (worm-handoff plan); remove once none does.
debug_worm_state = true

[[components]]
id = "hl.highlander"
type = "scheme"
name = "Highlander"
description = "Project X's Highlander: each worm is dealt one weapon from each of three pools, may use each once a turn, and takes everything a worm it kills carried."
entry = "components/highlander.lua"
preset = "highlander"
changes_rules = true
tags = ["highlander"]

[[components]]
id = "hl.weapons_only"
type = "scheme"
name = "Highlander weapons (no rules)"
description = "Every Highlander weapon where PX's layout puts it, without Highlander's rules: no dealing, no one shot each per turn. The ammo is the WA lobby scheme's."
entry = "components/weapons_only.lua"
preset = "highlander"

