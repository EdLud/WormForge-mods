# Electric Mine -- Project X's weapon_electric_mine, ported to WormForge API 4.
#
# The mine keeps its own custom explosion (`lib/custom_explosion.lua`) and taze
# hold (`lib/electric_damage.lua`) here rather than in the `px` pack, whose
# upstream updates overwrote them. The effect manager and trail are the shared
# `effects.sdk` modules (`wf-lib/effects/px_effects` and
# `wf-lib/effects/trail`).
id = "px.electric"
name = "[Electrical]"
version = "0.5.8"
author = "reddaz"
api_version = 4
format_version = 2
dependencies = ["effects.sdk"]

# The taze modules are public: other bundles import `wf-lib/electric/damage`
# without copying the taze sheets or the loop sound, and any electric weapon
# can mark a mine with `wf-lib/electric/taze_mine`.
asset_namespace = "wf-lib/electric"
[exports]
"wf-lib/electric/damage" = "lib/electric_damage.lua"
"wf-lib/electric/taze_mine" = "lib/taze_mine.lua"

[[components]]

id = "px.electric_mine"
type = "weapon"
name = "Electric Mine"
credits = "ported by reddaz"
description = "A mine that sparks, arcs to nearby mines and tazes what it hits."
entry = "weapons/electric_mine.lua"
icon = "sprites/elemine.png"
default_position = { row = "F5", column = 2 }
