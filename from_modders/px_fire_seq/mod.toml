# Project X's sequential-firing weapons -- the Ripper Star, the Megashark, the
# hold-to-fire Megashark and the FAMAS -- and the shared base that fires their
# bursts, ported to WormForge API 4.
#
# PX sequences these weapons by overriding `CWorm::FireFinal` and returning
# before the stock fire so WA loops the shot (`ripper_fire.txt:11-32`,
# `megashark_firing.txt:49-76`). API 4 has no global shot hook, so the base
# (`lib/fire_seq.lua`) fires the first shot itself and lets a hidden timer
# actor fire the rest, while its brain holds `worm.shots_fired`/`shots_to_fire`
# at 0 and 1 so WA keeps the worm in its firing animation, as PX held
# `nShoots = 1; nShooted = 0` (the laser's own shape, `laser_gun.lua:180` --
# never from `on_fire`). The Megashark, its hold version and the FAMAS spawn
# Lua actor rounds with `fire_sequential_actor`; the Ripper's live build uses
# the missile base (`fire_seq_mis`). See README.md and the report.
#
# One bundle, not one per weapon, because they share the base and PX's
# weapon-less worm posture (`sprites/px_hold/aim*`, `draw*`, the three hands),
# and a weapon's `worm_sprites` sheets resolve only inside the bundle that
# claims them (API 4 `require` is bundle-local). The trail is the exception:
# it is the shared `effects.sdk` module (`wf-lib/effects/trail`).
#
# A component bundle (format_version 2): nothing runs until a profile selects
# it; profiles/ holds one per weapon to load in the mod loader.
id = "px.fire_seq"
name = "[Guns] Sequential Fire"
version = "1.3.4"
author = "reddaz"
api_version = 4
format_version = 2
dependencies = ["effects.sdk"]
mod_icon = "profiles/mod_icon.png"

# The burst base on its own, for a pack that declares
# `dependencies = ["px.fire_seq"]` and then `require("wf-lib/fire_seq")`.
# See README.md, "When not to use it", before reaching for it.
[exports]
"wf-lib/fire_seq" = "lib/fire_seq.lua"

[[components]]
id = "px.ripper_star"
type = "weapon"
name = "Ripper Star"
description = "Throws fifteen shurikens in a burst; each bites what it hits for 4 damage or sticks in the land."
entry = "weapons/ripper_star.lua"
icon = "sprites/ripper_star/icon.png"
default_position = { row = "F10", column = 1 }

[[components]]
id = "px.megashark"
type = "weapon"
name = "Megashark"
description = "A burst of twelve homing bullets, four to a target, each exploding on impact."
entry = "weapons/megashark.lua"
icon = "sprites/megashark/icon.png"
default_position = { row = "F10", column = 2 }

[[components]]
id = "px.megashark_hold"
type = "weapon"
name = "Megashark (hold to fire)"
description = "The Megashark firing while Space is held, up to 20 bullets."
entry = "weapons/fire_while_holding_megashark.lua"
icon = "sprites/megashark/icon.png"
default_position = { row = "F10", column = 3 }

[[components]]
id = "px.famas"
type = "weapon"
name = "FAMAS"
description = "Three-round bursts of straight 13-damage bullets."
entry = "weapons/famas.lua"
icon = "sprites/famas/icon.png"
default_position = { row = "F3", column = 6 }
