# The hold-to-fire Megashark on its own slot, with infinite ammo and no weapon
# delay so it can be tested at once. It shares the fixed Megashark's art and
# bullets but not its twelve-shot limit: hold Space to keep firing, release it
# to stop after the bullet already in flight. A finite ammo setting fires that
# many bullets, up to 20; infinite ammo uses the 20 cap.
description = "The Megashark that fires while Space is held."
features = []

[weapons]
"px.megashark_hold" = { row = "F10", column = 3 }

[weapon_settings."px.megashark_hold"]
ammo = -1
delay = 0
crate = 0
