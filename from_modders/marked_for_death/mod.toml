# Project X Curse of Death (utility_curse_of_death.pxl), ported to WormBench.
#
# The four weapons keep PX's own .wep records (two no-turn specials and two
# click strikes). Lua adds the mark, the curse, the homing pass and the two
# overlays; the README carries the PX line citations and the departures.
id = "px.curse_of_death"
name = "Curse of Death"
version = "1.0.6"
author = "reddaz"
api_version = 5
format_version = 2
dependencies = ["effects.sdk"]
[[components]]

id = "px.death_mark"
type = "weapon"
name = "Death Mark"
credits = "reddaz"
description = "Marks the worm in front so it takes more damage for three turns, without ending the turn."
entry = "weapons/death_mark.lua"
icon = "sprites/curse/whiteprod_icon.png"
default_position = { row = "F10", column = 1 }

[[components.options]]
key = "dmg_percent"
type = "int"
min = 110
max = 500
default = 150
label = "Mark damage %"
description = "Damage a marked worm takes, in percent: 150 is 1.5x, 200 is double."
[[components]]

id = "px.homing_curse"
type = "weapon"
name = "Homing Curse"
credits = "reddaz"
description = "Curses the worm in front: loose mines, missiles, oil drums and arrows home at it for two turns, and magnetic actors are pulled toward it."
entry = "weapons/homing_curse.lua"
icon = "sprites/curse/redprod_icon.png"
default_position = { row = "F10", column = 2 }

[[components.options]]
key = "max_homing"
type = "int"
min = 1
max = 50
default = 3
label = "Max homing objects"
description = "How many mines, missiles, oil drums and arrows may home at one cursed worm."
[[components]]

id = "px.marked_for_death"
type = "weapon"
name = "Marked For Death"
credits = "T17/reddaz"
description = "Click a worm to mark it for more damage for three turns; a click on nobody refunds the shot."
entry = "weapons/marked_for_death.lua"
icon = "sprites/curse/whitemark_icon.png"
default_position = { row = "F10", column = 3 }

[[components.options]]
key = "dmg_percent"
type = "int"
min = 110
max = 500
default = 150
label = "Mark damage %"
description = "Damage a marked worm takes, in percent: 150 is 1.5x, 200 is double."
[[components]]

id = "px.wish_of_death"
type = "weapon"
name = "Wish Of Death"
credits = "reddaz"
description = "Click a worm to curse it: nearby mines, missiles, oil drums and arrows home at it, and magnetic actors are pulled toward it; a click on nobody refunds the shot."
entry = "weapons/wish_of_death.lua"
icon = "sprites/curse/markicon.png"
default_position = { row = "F10", column = 4 }

[[components.options]]
key = "max_homing"
type = "int"
min = 1
max = 50
default = 3
label = "Max homing objects"
description = "How many mines, missiles, oil drums and arrows may home at one cursed worm."
