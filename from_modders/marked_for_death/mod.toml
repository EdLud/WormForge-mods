# Project X Curse of Death (utility_curse_of_death.pxl), ported to WormForge
# API 4.
#
# The four weapons keep PX's own .wep records (two no-turn specials and two
# click strikes). Lua adds the mark, the curse, the homing pass and the two
# overlays; the README carries the PX line citations and the departures.
id = "px.curse_of_death"
name = "Curse of Death"
version = "1.0.3"
author = "reddaz"
api_version = 4
format_version = 2
dependencies = ["effects.sdk"]
[[components]]

id = "px.death_mark"
type = "weapon"
name = "Death Mark"
credits = "reddaz"
description = "Marks the worm in front: it takes 50% more damage for three turns. Does not end the turn."
entry = "weapons/death_mark.lua"
icon = "sprites/curse/whiteprod_icon.png"
default_position = { row = "F10", column = 1 }

[[components.options]]
key = "dmg_percent"
type = "int"
min = 110
max = 500
default = 150
label = "Mark damage %"
description = "Extra damage the mark adds, in percent: 150 = 1.5x (PX's value), 200 = double."
[[components]]

id = "px.homing_curse"
type = "weapon"
name = "Homing Curse"
credits = "reddaz"
description = "Curses the worm in front: loose mines, missiles, oil drums and arrows home at it for two turns, and magnetic actors are pulled toward it."
entry = "weapons/homing_curse.lua"
icon = "sprites/curse/redprod_icon.png"
default_position = { row = "F10", column = 2 }

[[components.options]]
key = "max_homing"
type = "int"
min = 1
max = 50
default = 3
label = "Max homing objects"
description = "How many mines, missiles, oil drums and arrows may lock onto one cursed worm (PX: 3). Magnetic actors are pulled by the curse magnet and do not use a lock."
[[components]]

id = "px.marked_for_death"
type = "weapon"
name = "Marked For Death"
credits = "T17/reddaz"
description = "Click a worm to mark it: 50% more damage for three turns. Refunds the shot when the click finds nobody."
entry = "weapons/marked_for_death.lua"
icon = "sprites/curse/whitemark_icon.png"
default_position = { row = "F10", column = 3 }

[[components.options]]
key = "dmg_percent"
type = "int"
min = 110
max = 500
default = 150
label = "Mark damage %"
description = "Extra damage the mark adds, in percent: 150 = 1.5x (PX's value), 200 = double."
[[components]]

id = "px.wish_of_death"
type = "weapon"
name = "Wish Of Death"
credits = "reddaz"
description = "Click a worm to curse it: nearby mines, missiles, oil drums and arrows home at it, and magnetic actors are pulled toward it. Refunds the shot when the click finds nobody."
entry = "weapons/wish_of_death.lua"
icon = "sprites/curse/markicon.png"
default_position = { row = "F10", column = 4 }

[[components.options]]
key = "max_homing"
type = "int"
min = 1
max = 50
default = 3
label = "Max homing objects"
description = "How many mines, missiles, oil drums and arrows may lock onto one cursed worm (PX: 3). Magnetic actors are pulled by the curse magnet and do not use a lock."
